# Sentinel Medical AI — Pipeline Configuration
# =============================================

# Data Pipeline
data:
  raw_dicom_dir: "data/raw_dicom"
  annotations_dir: "data/annotations"
  processed_dir: "data/processed"
  image_size: 512
  pixel_range: [0.0, 1.0]
  supported_modalities: ["CR", "CT", "MR", "DX"]  # CR=X-ray, DX=Digital X-ray

# Dataset Split
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratify: true

# Augmentation (MONAI)
augmentation:
  rand_flip_prob: 0.5
  rand_rotate_range: 0.2618  # ±15 degrees in radians
  rand_scale_intensity_factors: [0.1]
  rand_shift_intensity_offsets: [0.1]
  rand_zoom_range: [0.9, 1.1]
  elastic_deform_sigma: 5.0
  elastic_deform_magnitude: 50

# DenseNet121 Classification
classification:
  model_name: "densenet121"
  pretrained: true
  num_classes: 14  # CheXNet default — adjustable per dataset
  input_channels: 1  # grayscale medical images
  image_size: 512
  batch_size: 16
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler: "cosine"
  early_stopping_patience: 15
  early_stopping_metric: "val_recall"
  checkpoint_dir: "models/densenet"
  class_names:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Effusion"
    - "Infiltration"
    - "Mass"
    - "Nodule"
    - "Pneumonia"
    - "Pneumothorax"
    - "Consolidation"
    - "Edema"
    - "Emphysema"
    - "Fibrosis"
    - "Pleural_Thickening"
    - "Hernia"

# nnU-Net Segmentation
segmentation:
  dataset_id: 100
  dataset_name: "SentinelChestXray"
  model_dir: "models/nnunet"

# Inference
inference:
  densenet_checkpoint: "models/densenet/best_model.pt"
  nnunet_model_dir: "models/nnunet"
  device: "auto"  # auto-detect GPU/CPU/MPS
  max_inference_time_seconds: 10
  confidence_threshold: 0.5
  host: "127.0.0.1"
  port: 8000

# Grad-CAM
gradcam:
  target_layer: "features.denseblock4"  # last dense block in DenseNet121

# Database
database:
  path: "data/sentinel.db"
  encryption_key_env: "SENTINEL_DB_KEY"

# Logging
logging:
  level: "INFO"
  log_dir: "logs"
  mlflow_tracking_uri: "mlruns"
